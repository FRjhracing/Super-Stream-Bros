<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSBU:Full Bracket</title>
<link rel="stylesheet" href="/static/dock.css">
<link rel="stylesheet" href="/static/bracket.css">
</head>
<body class="bracket-page">
<header class="bar">
  <div class="title">
    <strong id="t-name">Bracket</strong>
    <span id="counts" class="muted small"></span>
  </div>
  <div class="bar-actions">
    <div id="groups" class="groups"></div>
    <label class="toggle" title="Hide sets that are finished"><input type="checkbox" id="hide-done"> Hide finished</label>
    <span id="updated" class="muted"></span>
    <button id="btn-refresh" title="Refresh">↻</button>
  </div>
</header>
<nav id="tabs" class="tabs"></nav>
<div id="status" class="status hidden"></div>

<main id="board" class="board"><p class="muted pad">Loading…</p></main>

<script src="/static/common.js"></script>
<script src="/static/bracket.js"></script>
</body>
</html>
